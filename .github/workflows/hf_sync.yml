name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]

  # Allows you to manually trigger the sync from GitHub's Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://arp947:$HF_TOKEN@huggingface.co/spaces/arp947/ATS-SCorer main
