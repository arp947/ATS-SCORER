services:
  - type: web
    name: ats-scorer-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && python -m spacy download en_core_web_md
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
